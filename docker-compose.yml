# kata-app-network
#
#   client -> edge (nginx) -> api (nginx) -> backend (whoami)
#             [frontend net]   [both nets]   [backend net]
#
# netshoot: toolbox with dig, nc, mtr, tcpdump, ss, tc, iptables.

name: kata

services:
  edge:
    image: nginx:1.27-alpine
    container_name: kata-edge
    ports:
      - "8080:80"
    volumes:
      - ./nginx/edge.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      API_HOST: api
      API_PORT: "8080"
    networks: [frontend]

  api:
    image: nginx:1.27-alpine
    container_name: kata-api
    volumes:
      - ./nginx/api.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "80"
    networks: [frontend, backend]

  backend:
    image: traefik/whoami:v1.10
    container_name: kata-backend
    environment:
      WHOAMI_NAME: backend
      WHOAMI_PORT_NUMBER: "80"
    networks: [backend]

  client:
    image: curlimages/curl:8.10.1
    container_name: kata-client
    command: ["sh","-c","while true; do curl -s -o /dev/null --max-time 5 -w \"$$(date +%T)  HTTP %{http_code}  %{time_total}s\\n\" http://edge/ || echo \"$$(date +%T)  FAIL  (curl exit $$?)\"; sleep 1; done"]
    depends_on: [edge]
    networks: [frontend]

  netshoot:
    image: nicolaka/netshoot:v0.13
    container_name: kata-netshoot
    command: sleep infinity
    cap_add: [NET_ADMIN, NET_RAW]
    networks: [frontend, backend]

networks:
  frontend:
    name: kata_frontend
  backend:
    name: kata_backend
